vertices:
  StaticMeshVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Position
        type: vec3
      - name: TextureCoords
        type: vec2
      - name: Normal
        type: vec3

  StaticMeshInstance:
    binding:
      inputRate: INSTANCE
    attributes:
      - name: InstanceModel
        type: mat4
      - name: InstanceMaterialIndex
        type: uint

  SkyBoxVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Position
        type: vec3

  TerrainVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Altitude
        type: float

samplers:
  ShadowMap:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_BORDER
    addressModeV: CLAMP_TO_BORDER
    addressModeW: CLAMP_TO_BORDER
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 1

  DiffuseTexture:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16

  ColorAttachment:
    magFilter: LINEAR
    minFilter: LINEAR
    mipmapMode: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

  DepthAttachment:
    magFilter: NEAREST
    minFilter: NEAREST
    mipmapMode: NEAREST
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: false
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

shaders:
  StaticMeshVertex:
    path: "./Resources/Shaders/Entity_vert.spv"
    PipelineStage: Vertex
  StaticMeshFragment:
    path: "./Resources/Shaders/Entity_frag.spv"
    PipelineStage: Fragment
  DeferredVertex:
    path: "./Resources/Shaders/Deferred_vert.spv"
    PipelineStage: Vertex
  DeferredFragment:
    path: "./Resources/Shaders/Deferred_frag.spv"
    PipelineStage: Fragment
  TerrainGeneratorVertex:
    path: "./Resources/Shaders/TerrainGenerator_vert.spv"
    PipelineStage: Vertex
  TerrainGeneratorFragment:
    path: "./Resources/Shaders/TerrainGenerator_frag.spv"
    PipelineStage: Fragment
  SkyBoxVertex:
    path: "./Resources/Shaders/SkyBox_vert.spv"
    PipelineStage: Vertex
  SkyBoxFragment:
    path: "./Resources/Shaders/SkyBox_frag.spv"
    PipelineStage: Fragment
  DepthVertex:
    path: "./Resources/Shaders/Depth_vert.spv"
    PipelineStage: Vertex
  QuadBasedSphereVertex:
    path: "./Resources/Shaders/QuadBasedSphere_vert.spv"
    PipelineStage: Vertex
  QuadBasedSphereFragment:
    path: "./Resources/Shaders/QuadBasedSphere_frag.spv"
    PipelineStage: Fragment

DescriptorSetLayouts:
  FrameDataLayout:
    bindings:
      - type: uniform
        updateFrequency: PerFrame
        stages: VERTEX | FRAGMENT

  ShadowMapArrayLayout:
    bindings:
      - type: sampler2d
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

  MaterialLayout:
    bindings:
      - type: buffer
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

  BindlesTexturesLayout:
    bindings:
      - type: sampler2DArray
        updateFrequency: Static
        stages: FRAGMENT

  MainPassOutputLayout:
    bindings:
      - type: sampler2d
        updateFrequency: Static
        stages: FRAGMENT
      - type: sampler2d
        updateFrequency: Static
        stages: FRAGMENT

  LightSpaceMatrixLayout:
    bindings:
      - type: uniform
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

PushConstants:
  MainConstant:
    - type: uint
      stages: VERTEX | FRAGMENT