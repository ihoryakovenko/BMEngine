samplers:
  ShadowMap:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_BORDER
    addressModeV: CLAMP_TO_BORDER
    addressModeW: CLAMP_TO_BORDER
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 1

  DiffuseTexture:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16

  ColorAttachment:
    magFilter: LINEAR
    minFilter: LINEAR
    mipmapMode: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

  DepthAttachment:
    magFilter: NEAREST
    minFilter: NEAREST
    mipmapMode: NEAREST
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: false
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

shaders:
  StaticMeshVertex:
    path: "./Resources/Shaders/Entity_vert.spv"
    PipelineStage: Vertex
  StaticMeshFragment:
    path: "./Resources/Shaders/Entity_frag.spv"
    PipelineStage: Fragment
  DeferredVertex:
    path: "./Resources/Shaders/Deferred_vert.spv"
    PipelineStage: Vertex
  DeferredFragment:
    path: "./Resources/Shaders/Deferred_frag.spv"
    PipelineStage: Fragment
  DepthVertex:
    path: "./Resources/Shaders/Depth_vert.spv"
    PipelineStage: Vertex
