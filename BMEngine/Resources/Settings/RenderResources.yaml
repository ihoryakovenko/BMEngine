vertices:
  StaticMeshVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Position
        type: vec3
      - name: TextureCoords
        type: vec2
      - name: Normal
        type: vec3

  StaticMeshInstance:
    binding:
      inputRate: INSTANCE
    attributes:
      - name: InstanceModel
        type: mat4
      - name: InstanceMaterialIndex
        type: uint

  SkyBoxVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Position
        type: vec3

  TerrainVertex:
    binding:
      inputRate: VERTEX
    attributes:
      - name: Altitude
        type: float

samplers:
  ShadowMap:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_BORDER
    addressModeV: CLAMP_TO_BORDER
    addressModeW: CLAMP_TO_BORDER
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 1

  DiffuseTexture:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16

  SpecularTexture:
    magFilter: LINEAR
    minFilter: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false
    mipmapMode: LINEAR
    mipLodBias: 0.0
    minLod: 0.0
    maxLod: 0.0
    anisotropyEnable: true
    maxAnisotropy: 1

  ColorAttachment:
    magFilter: LINEAR
    minFilter: LINEAR
    mipmapMode: LINEAR
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: true
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

  DepthAttachment:
    magFilter: NEAREST
    minFilter: NEAREST
    mipmapMode: NEAREST
    addressModeU: CLAMP_TO_EDGE
    addressModeV: CLAMP_TO_EDGE
    addressModeW: CLAMP_TO_EDGE
    minLod: 0.0
    maxLod: 0.0
    mipLodBias: 0.0
    anisotropyEnable: false
    maxAnisotropy: 16.0
    compareEnable: false
    borderColor: INT_OPAQUE_BLACK
    unnormalizedCoordinates: false

shaders:
  StaticMeshVertex: "./Resources/Shaders/Entity_vert.spv"
  StaticMeshFragment: "./Resources/Shaders/Entity_frag.spv"
  DeferredVertex: "./Resources/Shaders/Deferred_vert.spv"
  DeferredFragment: "./Resources/Shaders/Deferred_frag.spv"
  TerrainGeneratorVertex: "./Resources/Shaders/TerrainGenerator_vert.spv"
  TerrainGeneratorFragment: "./Resources/Shaders/TerrainGenerator_frag.spv"
  SkyBoxVertex: "./Resources/Shaders/SkyBox_vert.spv"
  SkyBoxFragment: "./Resources/Shaders/SkyBox_frag.spv"
  DepthVertex: "./Resources/Shaders/Depth_vert.spv"
  QuadBasedSphereVertex: "./Resources/Shaders/QuadBasedSphere_vert.spv"
  QuadBasedSphereFragment: "./Resources/Shaders/QuadBasedSphere_frag.spv"

DescriptorSetLayouts:
  FrameDataLayout:
    bindings:
      - type: uniform
        updateFrequency: PerFrame
        stages: VERTEX | FRAGMENT

  ShadowMapArrayLayout:
    bindings:
      - type: sampler2d
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

  MaterialLayout:
    bindings:
      - type: buffer
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

  BindlesTexturesLayout:
    bindings:
      - type: sampler2DArray
        updateFrequency: Static
        stages: FRAGMENT
      - type: sampler2DArray
        updateFrequency: Static
        stages: FRAGMENT

  MainPassOutputLayout:
    bindings:
      - type: sampler2d
        updateFrequency: Static
        stages: FRAGMENT
      - type: sampler2d
        updateFrequency: Static
        stages: FRAGMENT

  LightSpaceMatrixLayout:
    bindings:
      - type: uniform
        updateFrequency: Static
        stages: VERTEX | FRAGMENT

DescriptorSets:
  VpSet:
    name: VpSet
    layout: FrameDataLayout
    pool: MainPool
    bindings:
      - buffer: FrameData
        binding: 0
        descriptorType: UNIFORM_BUFFER_DYNAMIC
        offset: 0
        range: 384

  StaticMeshLightSet:
    name: StaticMeshLightSet
    layout: FrameDataLayout
    pool: MainPool
    bindings:
      - buffer: FrameData
        binding: 0
        descriptorType: UNIFORM_BUFFER_DYNAMIC
        offset: 384
        range: 1152

  BindlesTexturesSet:
    name: BindlesTexturesSet
    layout: BindlesTexturesLayout
    pool: MainPool

  MaterialSet:
    name: MaterialSet
    layout: MaterialLayout
    pool: MainPool
    bindings:
      - buffer: MaterialBuffer
        binding: 0
        descriptorType: STORAGE_BUFFER
        offset: 0
        range: VK_WHOLE_SIZE